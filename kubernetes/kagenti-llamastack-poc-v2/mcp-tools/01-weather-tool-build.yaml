# Weather Tool Build - AgentBuild CR
# Builds the weather MCP tool image from source
apiVersion: agent.kagenti.dev/v1alpha1
kind: AgentBuild
metadata:
  labels:
    app.kubernetes.io/created-by: llamastack-poc
    kagenti.io/framework: Python
    kagenti.io/protocol: mcp
    kagenti.io/type: tool
  name: weather-tool-build
  # namespace: set by script
spec:
  mode: dev
  source:
    sourceRepository: "github.com/kagenti/agent-examples.git"
    sourceRevision: "main"
    sourceSubfolder: "mcp/weather_tool"
    sourceCredentials:
      name: github-token-secret
  pipeline:
    namespace: kagenti-system
    parameters:
    - name: SOURCE_REPO_SECRET
      value: github-token-secret
    - name: registry-secret
      value: internal-registry-secret
  buildOutput:
    # image and imageRegistry set by script with envsubst
    image: "${NAMESPACE}/weather-tool"
    imageTag: "v0.0.1"
    imageRegistry: "image-registry.openshift-image-registry.svc:5000"
